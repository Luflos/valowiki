name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Pages serves the site from /<repo>, so assets and the router basename
      # are built against that prefix. Local dev and root-domain hosts are
      # unaffected, since PUBLIC_URL is empty there.
      - name: Build
        run: npm run build
        env:
          CI: false
          PUBLIC_URL: /${{ github.event.repository.name }}

      # Deep links like /agents/<id> would 404 on Pages; this copy lets the
      # SPA boot and hand the path to the router.
      - name: Add SPA fallback
        run: cp build/index.html build/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
